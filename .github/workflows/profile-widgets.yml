name: Update profile widgets

on:
  schedule:
    - cron: "0 3 * * *" # every day at 00:00 (Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  summary-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: -3

  contrib-3d:
    needs: summary-cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json
      - name: Remove duplicated language pie chart
        run: node .github/scripts/strip-pie.mjs profile-3d-contrib/profile-purple.svg
      - name: Commit 3D graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore: update 3D contribution graph"
          git pull --rebase origin main
          git push origin HEAD:main

  achievements:
    needs: contrib-3d
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build achievements card
        run: node .github/scripts/achievements.mjs achievements.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit achievements card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch metrics.achievements.svg
          git add achievements.svg
          git diff --cached --quiet || git commit -m "chore: update achievements card"
          git pull --rebase origin main
          git push origin HEAD:main

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5817fc&color_dots=#ebedf0,#d4c5fe,#a78bfa,#7c3aed,#5817fc
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#2e1a6b,#3f22a8,#5817fc,#a78bfa
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
